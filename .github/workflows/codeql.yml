# CodeQL — strict profile for a public repo.
#
# - security-extended: broader security queries (lower-precision included on
#   purpose; we prefer noisy-but-safe for the auth/token surface of this app).
# - config file (.github/codeql/codeql-config.yml) adds the quality suite and
#   scopes paths.
# - Actions are pinned to full commit SHAs (supply-chain); Dependabot's
#   github-actions ecosystem keeps the pins fresh.
# - PRs to any branch are scanned, not just main, so alerts surface before merge.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # All query suites live in the config file, NOT in a `queries:` input —
      # a workflow-level `queries` (without a "+" prefix) silently OVERRIDES the
      # config file's `queries` section, which would drop the extra suites.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          category: '/language:javascript-typescript'
