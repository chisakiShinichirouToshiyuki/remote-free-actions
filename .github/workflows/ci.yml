name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint · typecheck · authz contract tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      # free-actions-core is a git dependency whose prepare build uses bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.10'

      - run: npm ci

      - name: Lint (eslint, 0 warnings)
        run: npm run lint

      - name: Typecheck Amplify backend
        run: npm run typecheck:backend

      # The auth/authz invariants (bridge deny-by-default, last-org-admin
      # protection, one-org-per-user) are pinned as executable contracts.
      - name: Authz contract tests
        run: npm run test:run
# NOTE: the frontend `vite build` needs the deploy-generated amplify_outputs.json,
# so it runs on Amplify Hosting (ampx pipeline-deploy), not in this CI.
