# CodeQL config — maximum-strictness profile, blocking on every PR.
#
# Suites (unioned; all three live HERE — a workflow-level `queries:` input
# without a "+" prefix would silently override this section):
#   - security-extended
#   - security-and-quality
#   - security-experimental   (official experimental queries, low precision)
# Packs:
#   - GitHub Security Lab community audit pack for JS/TS (researcher-grade
#     queries that never graduate into the official suites).
#
# False-positive policy (SECURITY.md "Alert handling policy"): alerts are NOT
# dismissed as false positives. A pattern these queries flag is forbidden by
# coding standard — rewrite the code so the pattern does not occur. That is why
# the noisy suites are safe to keep blocking: noise converges to zero by
# construction, not by triage.
#
# Tests are scanned on purpose: secrets / injection sinks in fixtures are
# findings we want in a public repo, not noise.
name: max strictness profile

queries:
  - uses: security-extended
  - uses: security-and-quality
  - uses: security-experimental

packs:
  - githubsecuritylab/codeql-javascript-queries

paths:
  - src
  - amplify
paths-ignore:
  - '**/node_modules'
  - '**/dist'
  - '.amplify'

# No query-filters: filtering (even an `include`) narrows the union of the
# suites. Max strictness = run everything.
